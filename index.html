    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root{
            --ink: #0d0a1f;
            --velvet: #1b1339;
            --velvet-2: #241a4a;
            --rose: #ff3d7f;
            --rose-dark: #c42361;
            --gold: #f5c04e;
            --teal: #34e8c7;
            --cloud: #f4f1fb;
            --cloud-dim: rgba(244,241,251,0.62);
            --glass-border: rgba(255,255,255,0.14);
        }

        /* Light theme palette (toggled via .light-theme on body) */
        body.light-theme{
            --ink: #fdf6ea;
            --velvet: #ffe9d0;
            --velvet-2: #fff3e0;
            --rose: #ff3d7f;
            --rose-dark: #c42361;
            --gold: #e08a1e;
            --teal: #0d9488;
            --cloud: #2a1f3d;
            --cloud-dim: rgba(42,31,61,0.6);
            --glass-border: rgba(40,20,0,0.12);
        }

        body {
            padding-bottom: 70px;
            overflow-x: hidden;
            font-family: 'Poppins', sans-serif;
            background:
                radial-gradient(circle at 18% 15%, var(--velvet-2), transparent 55%),
                linear-gradient(160deg, var(--ink) 0%, var(--velvet) 55%, var(--ink) 100%);
            background-attachment: fixed;
            min-height: 100vh; color: var(--cloud);
            display: flex; flex-wrap: wrap; justify-content: center; align-items: center;
            position: relative;
            transition: background .3s linear, color .6s ease;
        }

        /* Theme sweep wave: rises from bottom of the page when toggled */
        .theme-wave{
            position: fixed; left: 0; right: 0; bottom: 0;
            height: 0%; width: 100%; z-index: 5; pointer-events: none;
            transition: height 1.05s cubic-bezier(.65,0,.35,1);
        }
        .theme-wave.active{ height: 100%; }
        .theme-wave.to-light{ background: linear-gradient(160deg, #fdf6ea 0%, #ffe9d0 55%, #fdf6ea 100%); }
        .theme-wave.to-dark{ background: linear-gradient(160deg, #0d0a1f 0%, #1b1339 55%, #0d0a1f 100%); }

        label, input, textarea, .subtitle, .logo, .file-btn, .btn, #status, .card, .preview div{
            transition: background-color .5s ease, border-color .5s ease, color .5s ease, box-shadow .5s ease, transform .15s ease;
        }

        /* Ambient background */
        .bg-orbs{ position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
        .orb{ position: absolute; border-radius: 50%; filter: blur(60px); }
        .orb-1{ width: 320px; height: 320px; background: var(--rose); opacity: .5; top: -90px; left: -70px; animation: drift1 18s ease-in-out infinite; }
        .orb-2{ width: 280px; height: 280px; background: var(--teal); opacity: .4; bottom: -100px; right: -80px; animation: drift2 22s ease-in-out infinite; }
        .orb-3{ width: 240px; height: 240px; background: var(--gold); opacity: .3; top: 42%; left: 62%; animation: drift3 26s ease-in-out infinite; }
        @keyframes drift1{ 0%,100%{ transform: translate(0,0); } 50%{ transform: translate(40px,55px); } }
        @keyframes drift2{ 0%,100%{ transform: translate(0,0); } 50%{ transform: translate(-45px,-35px); } }
        @keyframes drift3{ 0%,100%{ transform: translate(0,0) scale(1); } 50%{ transform: translate(-30px,45px) scale(1.15); } }

        .sparkles{ position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
        .sparkles span{ position: absolute; width: 4px; height: 4px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 6px 2px var(--gold); animation: twinkle 3s ease-in-out infinite; }
        .sparkles span:nth-child(1){ top: 12%; left: 16%; animation-delay: .2s; }
        .sparkles span:nth-child(2){ top: 24%; left: 82%; animation-delay: 1.1s; background: var(--teal); box-shadow: 0 0 6px 2px var(--teal); }
        .sparkles span:nth-child(3){ top: 66%; left: 9%; animation-delay: .6s; }
        .sparkles span:nth-child(4){ top: 80%; left: 76%; animation-delay: 1.6s; background: var(--rose); box-shadow: 0 0 6px 2px var(--rose); }
        .sparkles span:nth-child(5){ top: 46%; left: 50%; animation-delay: 2s; }
        .sparkles span:nth-child(6){ top: 15%; left: 55%; animation-delay: .9s; background: var(--teal); box-shadow: 0 0 6px 2px var(--teal); }
        @keyframes twinkle{ 0%,100%{ opacity: 0; transform: scale(.5); } 50%{ opacity: 1; transform: scale(1); } }

        .container { width: 100%; max-width: 450px; padding: 20px; position: relative; z-index: 1; perspective: 1000px; }

        .card {
            position: relative;
            background: linear-gradient(160deg, rgba(255,255,255,0.07), rgba(255,255,255,0.02));
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-radius: 28px; padding: 34px 30px; border: 1px solid var(--glass-border);
            box-shadow: 0 20px 60px -10px rgba(255,61,127,0.3), 0 10px 40px -10px rgba(52,232,199,0.12), inset 0 1px 0 rgba(255,255,255,0.08);
            text-align: center; overflow: hidden;
            transform-style: preserve-3d; transition: transform .25s ease, background .5s ease;
        }
        body.light-theme .card{
            background: linear-gradient(160deg, rgba(255,255,255,0.6), rgba(255,255,255,0.3));
            box-shadow: 0 20px 60px -10px rgba(255,61,127,0.18), 0 10px 40px -10px rgba(13,148,136,0.1), inset 0 1px 0 rgba(255,255,255,0.5);
        }
        .card-sheen{
            position: absolute; inset: 0; pointer-events: none; mix-blend-mode: overlay;
            background: linear-gradient(115deg, transparent 30%, rgba(255,255,255,0.18) 45%, rgba(255,255,255,0.04) 55%, transparent 70%);
            transform: translateX(-120%); transition: transform .8s ease;
        }
        .card:hover .card-sheen{ transform: translateX(120%); }

        .candle{
            position: absolute; top: 16px; right: 20px; font-size: 1.3rem;
            filter: drop-shadow(0 0 6px rgba(245,192,78,.8));
            animation: flicker 2.4s ease-in-out infinite; transform-origin: bottom center;
            background: none; border: none; padding: 4px; cursor: pointer; line-height: 1;
            -webkit-tap-highlight-color: transparent; z-index: 3; border-radius: 50%;
        }
        .candle:hover{ filter: drop-shadow(0 0 10px rgba(245,192,78,1)); }
        .candle:active{ transform: scale(.88); }
        .candle.switching{ animation: candleSpin .6s ease; }
        @keyframes candleSpin{
            0%{ transform: scale(1) rotate(0deg); }
            40%{ transform: scale(1.3) rotate(180deg); }
            100%{ transform: scale(1) rotate(360deg); }
        }
        @keyframes flicker{
            0%,100%{ transform: rotate(-2deg) scale(1); }
            25%{ transform: rotate(2deg) scale(1.04); }
            50%{ transform: rotate(-1deg) scale(.98); }
            75%{ transform: rotate(3deg) scale(1.05); }
        }

        .logo {
            font-family: 'Lobster', cursive; font-size: 1.95rem; line-height: 1.3;
            background: linear-gradient(135deg, var(--rose), var(--gold) 55%, var(--teal));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
            margin-bottom: 5px; letter-spacing: 0;
        }
        .subtitle { font-family: 'Quicksand', sans-serif; font-size: 0.95rem; font-weight: 500; color: var(--teal); margin-bottom: 26px; opacity: 0.85; letter-spacing: .2px; }
        .group { text-align: left; margin-bottom: 6px; }
        label {
            display: flex; align-items: baseline; gap: 6px;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.78rem; color: var(--gold);
            margin-bottom: 6px; font-weight: 600; text-transform: uppercase; letter-spacing: .4px;
        }
        label .req{ color: var(--rose); }
        label .opt{ color: var(--cloud-dim); font-weight: 400; text-transform: none; font-size: .85em; letter-spacing: 0; }

        input, textarea {
            width: 100%; padding: 12px 16px; font-size: 0.95rem; font-family: 'Nunito', sans-serif;
            border: 1px solid var(--glass-border);
            background: var(--field-bg, rgba(255, 255, 255, 0.04)); color: var(--cloud);
            border-radius: 14px; margin-bottom: 14px; outline: none;
            transition: border-color .2s, box-shadow .2s, background .2s;
        }
        body.light-theme input, body.light-theme textarea{ background: rgba(255,255,255,0.55); }
        input::placeholder, textarea::placeholder{ color: rgba(244,241,251,0.35); }
        body.light-theme input::placeholder, body.light-theme textarea::placeholder{ color: rgba(42,31,61,0.4); }
        input:focus, textarea:focus { border-color: var(--rose); background: rgba(255,255,255,0.07); box-shadow: 0 0 0 4px rgba(255,61,127,0.15); }
        body.light-theme input:focus, body.light-theme textarea:focus{ background: rgba(255,255,255,0.85); }
        textarea{ resize: vertical; min-height: 70px; }

        /* Typing effect: brief glow + lift pulse fired on every keystroke */
        @keyframes keyPulse{
            0%{ box-shadow: 0 0 0 4px rgba(255,61,127,0.15); transform: translateY(0) scale(1); }
            35%{ box-shadow: 0 0 0 6px rgba(255,61,127,0.28), 0 0 18px rgba(245,192,78,.35); transform: translateY(-1px) scale(1.008); }
            100%{ box-shadow: 0 0 0 4px rgba(255,61,127,0.15); transform: translateY(0) scale(1); }
        }
        input.typing-fx, textarea.typing-fx{ animation: keyPulse .28s ease; }

        /* ===== Wish Ideas button + panel ===== */
        .msg-label-row{
            display: flex; align-items: center; justify-content: space-between;
            gap: 8px; margin-bottom: 6px;
        }
        .msg-label-row label{ margin-bottom: 0; }

        .wish-btn{
            display: flex; align-items: center; gap: 5px;
            font-family: 'Space Grotesk', sans-serif; font-size: 0.68rem; font-weight: 600;
            letter-spacing: .3px; text-transform: uppercase; white-space: nowrap;
            color: var(--ink); background: linear-gradient(135deg, var(--gold), var(--rose) 80%);
            border: none; border-radius: 30px; padding: 6px 12px; cursor: pointer;
            box-shadow: 0 4px 14px -4px rgba(245,192,78,.55);
            -webkit-tap-highlight-color: transparent;
            transition: transform .15s ease, box-shadow .2s ease;
            position: relative; overflow: hidden;
        }
        body.light-theme .wish-btn{ color: #fff; }
        .wish-btn::after{
            content:""; position: absolute; inset: 0; border-radius: 30px;
            background: linear-gradient(135deg, rgba(255,255,255,.5), transparent 60%);
            opacity: .5; mix-blend-mode: overlay;
        }
        .wish-btn:hover{ transform: translateY(-1px) scale(1.03); box-shadow: 0 6px 18px -4px rgba(245,192,78,.7); }
        .wish-btn:active{ transform: translateY(0) scale(.96); }
        .wish-btn.active{ box-shadow: 0 0 0 3px rgba(52,232,199,.35), 0 4px 14px -4px rgba(245,192,78,.55); }
        .wish-btn-icon{ animation: giftWiggle 2.6s ease-in-out infinite; display: inline-block; }
        @keyframes giftWiggle{
            0%,100%{ transform: rotate(0deg); }
            10%{ transform: rotate(-12deg); }
            20%{ transform: rotate(10deg); }
            30%{ transform: rotate(-6deg); }
            40%{ transform: rotate(0deg); }
        }

        .wish-panel{
            max-height: 0; opacity: 0; overflow: hidden; margin-bottom: 0;
            border-radius: 20px; pointer-events: none;
            transition: max-height .45s cubic-bezier(.65,0,.35,1), opacity .35s ease, margin-bottom .45s ease;
        }
        .wish-panel.open{
            max-height: 360px; opacity: 1; margin-bottom: 16px; pointer-events: auto;
        }
        .wish-panel{
            background: linear-gradient(160deg, rgba(255,61,127,0.08), rgba(52,232,199,0.05));
            border: 1px solid var(--glass-border);
        }
        body.light-theme .wish-panel{
            background: linear-gradient(160deg, rgba(255,255,255,0.55), rgba(255,233,208,0.35));
        }
        .wish-panel-head{
            display: flex; align-items: center; justify-content: space-between;
            padding: 12px 14px 8px;
        }
        .wish-panel-title{
            font-family: 'Comfortaa', sans-serif; font-weight: 700; font-size: 0.85rem;
            background: linear-gradient(135deg, var(--rose), var(--gold) 60%, var(--teal));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }
        .wish-close{
            background: rgba(255,255,255,0.08); border: none; color: var(--cloud);
            width: 24px; height: 24px; border-radius: 50%; cursor: pointer; font-size: .75rem;
            display: flex; align-items: center; justify-content: center;
            transition: background .2s, transform .15s;
        }
        .wish-close:hover{ background: rgba(255,61,127,0.25); transform: rotate(90deg); }

        .wish-list{
            max-height: 290px; overflow-y: auto; padding: 4px 12px 14px;
            display: flex; flex-direction: column; gap: 9px;
        }
        .wish-list::-webkit-scrollbar{ width: 5px; }
        .wish-list::-webkit-scrollbar-thumb{ background: var(--rose); border-radius: 10px; }
        .wish-list::-webkit-scrollbar-track{ background: transparent; }

        .wish-card{
            display: flex; align-items: flex-start; gap: 10px;
            text-align: left; padding: 10px 30px 10px 12px; border-radius: 14px; cursor: pointer;
            background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border);
            color: var(--cloud); font-family: 'Nunito', sans-serif; font-size: 0.82rem; line-height: 1.35;
            position: relative; -webkit-tap-highlight-color: transparent;
            opacity: 0; transform: translateY(10px);
            animation: wishCardIn .4s ease forwards;
            transition: border-color .2s, background .2s, transform .15s;
        }
        .wish-card span:not(.wish-card-emoji):not(.wish-card-num){ flex: 1; min-width: 0; }
        body.light-theme .wish-card{ background: rgba(255,255,255,0.55); }
        .wish-card:hover{ border-color: var(--teal); background: rgba(52,232,199,0.09); transform: translateY(-2px); }
        .wish-card:active{ transform: translateY(0) scale(.98); }
        .wish-card-emoji{ font-size: 1.15rem; flex-shrink: 0; line-height: 1.2; }
        .wish-card-num{
            position: absolute; top: 6px; right: 9px; font-family: 'Space Grotesk', sans-serif;
            font-size: 0.62rem; color: var(--cloud-dim); opacity: .6;
        }
        .wish-card.picked{ animation: wishPicked .5s ease; }
        @keyframes wishPicked{
            0%{ box-shadow: 0 0 0 0 rgba(52,232,199,.5); }
            40%{ box-shadow: 0 0 0 8px rgba(52,232,199,.18); border-color: var(--teal); }
            100%{ box-shadow: 0 0 0 0 rgba(52,232,199,0); }
        }
        @keyframes wishCardIn{ to{ opacity: 1; transform: translateY(0); } }

        .copy-toast{
            position: fixed; bottom: 78px; left: 50%; transform: translateX(-50%) translateY(10px);
            background: linear-gradient(135deg, var(--teal), var(--rose));
            color: #08251f; font-family: 'Baloo 2', sans-serif; font-weight: 700; font-size: .85rem;
            padding: 9px 20px; border-radius: 30px; box-shadow: 0 10px 24px -6px rgba(0,0,0,.4);
            opacity: 0; pointer-events: none; z-index: 20;
            transition: opacity .25s ease, transform .25s ease;
        }
        .copy-toast.show{ opacity: 1; transform: translateX(-50%) translateY(0); }

        .dates { display: grid; grid-template-columns: 1fr auto 1fr auto 1fr; align-items: center; gap: 6px; }
        .dates input{ text-align: center; }
        .sep{ color: var(--cloud-dim); font-weight: 300; padding-bottom: 14px; }

        .file-btn {
            width: 100%; padding: 14px; background: rgba(255, 255, 255, 0.04);
            border: 2px dashed rgba(255, 255, 255, 0.2); border-radius: 16px;
            cursor: pointer; color: var(--cloud); margin-bottom: 12px; font-size: 0.95rem;
            font-family: 'Comfortaa', sans-serif; font-weight: 500;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            position: relative; overflow: hidden; -webkit-tap-highlight-color: transparent;
            transition: border-color .2s, background .2s, transform .12s;
        }
        body.light-theme .file-btn{ background: rgba(255,255,255,0.4); border-color: rgba(40,20,0,0.18); }
        .file-btn:hover{ border-color: var(--teal); background: rgba(52,232,199,0.07); transform: translateY(-1px); }
        .file-btn:active{ transform: translateY(0) scale(.97); }

        .preview { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; margin-bottom: 16px; }
        .preview div {
            height: 90px; border-radius: 14px; overflow: hidden; border: 3px solid var(--cloud);
            box-shadow: 0 8px 18px rgba(0,0,0,.4); background: #fff;
            animation: popIn .35s ease; transition: transform .2s;
        }
        .preview div:nth-child(1){ transform: rotate(-3deg); }
        .preview div:nth-child(2){ transform: rotate(3deg); }
        .preview div:nth-child(1):hover{ transform: rotate(-3deg) translateY(-3px) scale(1.04); }
        .preview div:nth-child(2):hover{ transform: rotate(3deg) translateY(-3px) scale(1.04); }
        .preview img { width: 100%; height: 100%; object-fit: cover; }
        @keyframes popIn{ from{ opacity: 0; } to{ opacity: 1; } }

        .btn {
            position: relative; overflow: hidden;
            width: 100%; background: linear-gradient(135deg, var(--rose), var(--rose-dark) 50%, var(--gold));
            color: white; padding: 15px; font-size: 1.05rem; border: none;
            font-family: 'Baloo 2', sans-serif; font-weight: 700;
            border-radius: 50px; cursor: pointer; letter-spacing: .3px;
            -webkit-tap-highlight-color: transparent;
            box-shadow: 0 10px 26px -6px rgba(255,61,127,.55);
            transition: transform .15s, box-shadow .2s;
        }
        .btn::before{
            content: ""; position: absolute; top: 0; left: -60%; width: 50%; height: 100%;
            background: linear-gradient(120deg, transparent, rgba(255,255,255,.45), transparent);
            transform: skewX(-20deg); animation: sheen 3.2s ease-in-out infinite;
        }
        @keyframes sheen{ 0%{ left: -60%; } 50%{ left: 120%; } 100%{ left: 120%; } }
        .btn:hover{ transform: translateY(-2px); box-shadow: 0 14px 30px -6px rgba(255,61,127,.7); }
        .btn:active{ transform: translateY(0) scale(.97); }
        .btn:disabled { opacity: 0.5; box-shadow: none; }
        .btn:disabled::before{ display: none; }

        .ripple{
            position: absolute; border-radius: 50%; background: rgba(255,255,255,0.55);
            transform: scale(0); opacity: .6; pointer-events: none;
            animation: rippleAnim .55s ease-out forwards;
        }
        @keyframes rippleAnim{ to{ transform: scale(1); opacity: 0; } }

        #status { font-family: 'Karla', sans-serif; margin-top: 14px; font-size: 0.85rem; color: var(--teal); min-height: 1em; }
        #status:not(:empty){
            display: inline-block; padding: 8px 16px; border-radius: 30px;
            background: rgba(52,232,199,0.1); border: 1px solid rgba(52,232,199,0.25);
            animation: fadeUp .3s ease;
        }
        @keyframes fadeUp{ from{ opacity: 0; transform: translateY(4px); } to{ opacity: 1; transform: translateY(0); } }

        button:focus-visible, input:focus-visible, textarea:focus-visible{
            outline: 2px solid var(--teal); outline-offset: 2px;
        }

        /* ===== Responsive sizing: phones, tablets, laptops, desktops ===== */

        /* Small phones (older iPhones / narrow Android) */
        @media (max-width: 360px){
            .card{ padding: 24px 18px; border-radius: 22px; }
            .logo{ font-size: 1.6rem; }
            .subtitle{ font-size: 0.85rem; margin-bottom: 20px; }
            label{ font-size: 0.72rem; }
            input, textarea{ padding: 10px 13px; font-size: 0.9rem; }
            .btn{ font-size: 0.98rem; padding: 13px; }
            .preview div{ height: 78px; }
        }

        /* Standard phones */
        @media (min-width: 361px) and (max-width: 480px){
            .container{ padding: 16px; }
            .card{ padding: 30px 24px; }
        }

        /* Large phones / small tablets in portrait */
        @media (min-width: 481px) and (max-width: 767px){
            .container{ max-width: 480px; }
            .card{ padding: 38px 34px; }
            .logo{ font-size: 2.1rem; }
        }

        /* Tablets (portrait & landscape) */
        @media (min-width: 768px) and (max-width: 1024px){
            .container{ max-width: 500px; }
            .card{ padding: 42px 38px; border-radius: 32px; }
            .logo{ font-size: 2.2rem; }

        function preview() {
            files = Array.from(document.getElementById('file').files).slice(0, 2);
            const pv = document.getElementById('pv');
            pv.innerHTML = '';
            files.forEach(f => {
                const r = new FileReader();
                r.onload = e => pv.innerHTML += `<div><img src="${e.target.result}"></div>`;
                r.readAsDataURL(f);
            });
        }

        // Convert to base64 with compression
        async function toBase64(file) {
            return new Promise((ok, err) => {
                const r = new FileReader();
                r.onload = e => {
                    const img = new Image();
                    img.onload = () => {
                        const c = document.createElement('canvas');
                        let w = img.width, h = img.height;
                        const max = 400;
                        if (w > h && w > max) { h *= max/w; w = max; }
                        else if (h > max) { w *= max/h; h = max; }
                        c.width = w; c.height = h;
                        c.getContext('2d').drawImage(img, 0, 0, w, h);
                        // Get base64 without prefix
                        const base64 = c.toDataURL('image/jpeg', 0.6).split(',')[1];
                        ok(base64);
                    };
                    img.onerror = err;
                    img.src = e.target.result;
                };
                r.onerror = err;
                r.readAsDataURL(file);
            });
        }

        async function create() {
            const name = document.getElementById('name').value.trim();
            if (!name) return alert("Name required!");

            const btn = event.target;
            const st = document.getElementById('status');
            btn.disabled = true;
            btn.textContent = "Processing...";

            try {
                // Convert photos to base64
                let code1 = null, code2 = null;
                
                if (files.length > 0) {
                    st.textContent = "Converting photo 1...";
                    code1 = await toBase64(files[0]);
                    console.log("Photo 1 base64 length:", code1.length);
                }
                
                if (files.length > 1) {
                    st.textContent = "Converting photo 2...";
                    code2 = await toBase64(files[1]);
                    console.log("Photo 2 base64 length:", code2.length);
                }

                st.textContent = "Saving...";

                // Prepare data
                const d = document.getElementById('day').value;
                const m = document.getElementById('month').value;
                const y = document.getElementById('year').value;
                const msg = document.getElementById('msg').value.trim();
                
                const date = (d && m && y) ? `${y}-${m.padStart(2,'0')}-${d.padStart(2,'0')}` : null;
                
                const data = {
                    name: name,
                    birth_date: date,
                    message: msg || "Wishing you a wonderful birthday! 🎂",
                    photo_url: code1,
                    photo_url_2: code2
                };
                
                console.log("📊 Data to save:");
                console.log("- name:", data.name);
                console.log("- photo_url length:", data.photo_url ? data.photo_url.length : 0);
                console.log("- photo_url_2 length:", data.photo_url_2 ? data.photo_url_2.length : 0);

                // Save to database
                const res = await fetch(API, {
                    method: "POST",
                    headers: {
                        "apikey": KEY,
                        "Authorization": `Bearer ${KEY}`,
                        "Content-Type": "application/json",
                        "Prefer": "return=representation"
                    },
                    body: JSON.stringify(data)
                });

                console.log("📡 Save response status:", res.status);

                if (!res.ok) {
                    const err = await res.text();
                    console.error("❌ Save error:", err);
                    throw new Error("Save failed");
                }

                const saved = await res.json();
                console.log("✅ Saved data:", saved);
                const id = saved[0].id;
                
                console.log("🆔 Saved with ID:", id);
                console.log("📸 Saved photo_url length:", saved[0].photo_url ? saved[0].photo_url.length : 0);
                st.textContent = "Success!";
                
                setTimeout(() => {
                    location.href = `index2.html?id=${id}`;
                }, 500);

            } catch (e) {
                console.error(e);
                st.textContent = "Error!";
                btn.disabled = false;
                btn.textContent = "✨ Create";
                alert("Failed! Check console (F12)");
            }
        }

        function showToast(text){
            var toast = document.getElementById('copyToast');
            if (!toast){
                toast = document.createElement('div');
                toast.id = 'copyToast';
                toast.className = 'copy-toast';
                document.body.appendChild(toast);
            }
            toast.textContent = text;
            requestAnimationFrame(function(){ toast.classList.add('show'); });
            clearTimeout(toast._hideTimer);
            toast._hideTimer = setTimeout(function(){ toast.classList.remove('show'); }, 1800);
        }

        function selectWish(text, cardEl){
            msgField.value = text;
            msgField.classList.remove('typing-fx');
            void msgField.offsetWidth;
            msgField.classList.add('typing-fx');

            if (cardEl){
                cardEl.classList.add('picked');
                setTimeout(function(){ cardEl.classList.remove('picked'); }, 500);
            }

            // Copy to clipboard (with fallback for older mobile browsers)
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(function(){
                    showToast('✅ Copied & added!');
                }).catch(function(){
                    fallbackCopy(text);
                });
            } else {
                fallbackCopy(text);
            }

            setTimeout(function(){ toggleWishPanel(null, false); }, 350);
        }

        function fallbackCopy(text){
            var ta = document.createElement('textarea');
            ta.value = text;
            ta.style.position = 'fixed';
            ta.style.left = '-9999px';
            document.body.appendChild(ta);
            ta.select();
            try { document.execCommand('copy'); showToast('✅ Copied & added!'); }
            catch(e){ showToast('✨ Added to message!'); }
            document.body.removeChild(ta);
        }

        window.toggleWishPanel = function(e, force){
            if (e) e.preventDefault();
            var willOpen = (typeof force === 'boolean') ? force : !panel.classList.contains('open');
            if (willOpen){
                renderWishes();
                panel.classList.add('open');
                panel.setAttribute('aria-hidden', 'false');
                wishBtn.classList.add('active');
            } else {
                panel.classList.remove('open');
                panel.setAttribute('aria-hidden', 'true');
                wishBtn.classList.remove('active');
            }
        };
    })();

    <script>
    (function(){
        var btn = document.getElementById('themeToggle');
        var wave = document.getElementById('themeWave');
        if(!btn || !wave) return;
        var isLight = false;
        var animating = false;

        btn.addEventListener('click', function(){
            if (animating) return;
            animating = true;
            var goingLight = !isLight;

            // Prep wave color for the theme we're switching TO, then rise it from bottom
            wave.classList.remove('to-light', 'to-dark');
            wave.classList.add(goingLight ? 'to-light' : 'to-dark');
            wave.classList.add('active');

            // Spin/swap the candle <-> lantern icon partway through the rise
            btn.classList.add('switching');
            setTimeout(function(){
                btn.textContent = goingLight ? '🏮' : '🕯️';
            }, 280);

            // Once the wave fully covers the screen, flip the real theme underneath it
            setTimeout(function(){
                document.body.classList.toggle('light-theme', goingLight);
                isLight = goingLight;
            }, 950);

            // Then recede the wave to reveal the new theme already in place
            setTimeout(function(){
                wave.classList.remove('active');
                btn.classList.remove('switching');
                animating = false;
            }, 1150);
        });
    })();
    </script>

    <script>
    (function(){
        var card = document.getElementById('tiltCard');
        if(!card) return;
        var supportsHover = window.matchMedia('(hover: hover) and (pointer: fine)').matches;
        if(!supportsHover) return;
        var max = 6;
        card.addEventListener('mousemove', function(e){
            var r = card.getBoundingClientRect();
            var x = (e.clientX - r.left) / r.width;
            var y = (e.clientY - r.top) / r.height;
            var rx = (0.5 - y) * max * 2;
            var ry = (x - 0.5) * max * 2;
            card.style.transform = 'rotateX(' + rx + 'deg) rotateY(' + ry + 'deg)';
        });
        card.addEventListener('mouseleave', function(){
            card.style.transform = 'rotateX(0deg) rotateY(0deg)';
        });
    })();
    </script>

    <script>
    (function(){
        function spawnRipple(e){
            var el = e.currentTarget;
            var rect = el.getBoundingClientRect();
            var size = Math.max(rect.width, rect.height) * 2.2;
            var ripple = document.createElement('span');
            ripple.className = 'ripple';
            ripple.style.width = size + 'px';
            ripple.style.height = size + 'px';
            var originX = (typeof e.clientX === 'number' && e.clientX !== 0) ? e.clientX : rect.left + rect.width / 2;
            var originY = (typeof e.clientY === 'number' && e.clientY !== 0) ? e.clientY : rect.top + rect.height / 2;
            ripple.style.left = (originX - rect.left - size / 2) + 'px';
            ripple.style.top = (originY - rect.top - size / 2) + 'px';
            el.appendChild(ripple);
            ripple.addEventListener('animationend', function(){
                if (ripple && ripple.parentNode) ripple.parentNode.removeChild(ripple);
            });
        }
        var tapTargets = document.querySelectorAll('.btn, .file-btn');
        for (var i = 0; i < tapTargets.length; i++){
            tapTargets[i].addEventListener('click', spawnRipple);
        }
    })();
    </script>
