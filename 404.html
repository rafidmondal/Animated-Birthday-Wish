<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found | Animated Birthday Wish</title>
    <meta name="description" content="This page was not found. Please check the URL and go back to the Animated Birthday Wish home page." />
    <meta name="robots" content="noindex,follow" />
    <meta name="theme-color" content="#0d0a1f" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <style>
      *{box-sizing:border-box}
      html,body{margin:0;min-height:100%}
      body{
        font-family:'Poppins',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
        background:radial-gradient(circle at 18% 15%,#241a4a,transparent 55%),linear-gradient(160deg,#0d0a1f 0%,#1b1339 55%,#0d0a1f 100%);
        background-attachment:fixed;color:#f4f1fb;overflow-x:hidden;-webkit-font-smoothing:antialiased
      }
      .float{position:fixed;inset:0;pointer-events:none;overflow:hidden}
      .float span{position:absolute;bottom:-50px;opacity:.6;animation:rise linear infinite}
      @keyframes rise{to{transform:translateY(-118vh) rotate(20deg);opacity:0}}
      main{position:relative;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px 18px}
      .cake{font-size:clamp(72px,16vw,128px);line-height:1;display:inline-block;animation:dance 1.6s ease-in-out infinite}
      @keyframes dance{0%,100%{transform:translateY(0) rotate(-7deg) scale(1)}50%{transform:translateY(-14px) rotate(7deg) scale(1.1)}}
      .code{font-size:clamp(64px,18vw,140px);font-weight:800;line-height:1;margin:6px 0 0;color:#ff3d7f;text-shadow:0 6px 28px rgba(255,61,127,.5)}
      h1{font-size:clamp(22px,5.2vw,38px);margin:8px 0 10px;color:#f5c04e}
      .msg{font-size:clamp(16px,3.6vw,21px);font-weight:600;margin:0 0 6px;color:rgba(244,241,251,.85)}
      .url{display:inline-block;max-width:92vw;margin:8px 0 0;padding:8px 14px;border-radius:12px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);font:600 14px/1.4 ui-monospace,Menlo,Consolas,monospace;word-break:break-all;color:#34e8c7}
      .home{display:inline-block;margin:26px 0 10px;padding:20px 48px;border-radius:999px;background:linear-gradient(135deg,#ff3d7f,#ff7aa8);color:#fff;font-size:clamp(19px,4.6vw,28px);font-weight:800;text-decoration:none;box-shadow:0 12px 32px rgba(255,61,127,.45);transition:transform .15s}
      .home:hover,.home:focus{transform:scale(1.05)}
      .home:active{transform:scale(.97)}
      .auto{margin:4px 0 0;font-size:15px;font-weight:600;color:rgba(244,241,251,.7)}
      .auto a{color:#f5c04e}
      .help{margin:34px 0 0;font-size:15px;color:rgba(244,241,251,.75)}
      .help a{color:#f5c04e;font-weight:700;word-break:break-all}
      @media (prefers-reduced-motion:reduce){.cake,.float span{animation:none}}
    </style>
  </head>
  <body>
    <div class="float" aria-hidden="true" id="float"></div>
    <main>
      <div class="cake" aria-hidden="true">🎂</div>
      <p class="code">404</p>
      <h1>Oops! This page was not found</h1>
      <p class="msg">Please check the URL. It may have a small typo or a wrong link.</p>
      <span class="url" id="wrongUrl"></span>
      <a class="home" href="/">🎈 Go to Home Page</a>
      <p class="auto" id="auto">Taking you home in <b id="sec">10</b> seconds… <a href="#" id="stay">Stay here</a></p>
      <p class="help">Need help? Developer support: <a href="mailto:radidmondal@gmail.com">radidmondal@gmail.com</a></p>
    </main>
    <script>
      (function () {
        try { document.getElementById('wrongUrl').textContent = location.pathname + location.search; } catch (e) {}

        var box = document.getElementById('float');
        var icons = ['🎈', '🎉', '✨', '🎊', '💖'];
        for (var i = 0; i < 16; i++) {
          var s = document.createElement('span');
          s.textContent = icons[i % icons.length];
          s.style.left = Math.round(Math.random() * 96) + '%';
          s.style.fontSize = (18 + Math.round(Math.random() * 24)) + 'px';
          s.style.animationDuration = (9 + Math.random() * 9).toFixed(1) + 's';
          s.style.animationDelay = (-Math.random() * 12).toFixed(1) + 's';
          box.appendChild(s);
        }

        var left = 10, timer;
        var secEl = document.getElementById('sec');
        function stop() {
          clearInterval(timer);
          document.getElementById('auto').style.display = 'none';
        }
        document.getElementById('stay').addEventListener('click', function (e) { e.preventDefault(); stop(); });
        timer = setInterval(function () {
          left--;
          secEl.textContent = left;
          if (left <= 0) { clearInterval(timer); location.replace('/'); }
        }, 1000);
      })();
    </script>
  </body>
</html>
