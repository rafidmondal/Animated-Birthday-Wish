<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday! 🎂</title>
    <link href="https://fonts.googleapis.com/css2?family=Lobster&family=Righteous&family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root{
            --bg1:#1a1a2e; --bg2:#16213e; --bg3:#0f3460;
            --card-bg: rgba(255,255,255,0.05); --card-border: rgba(255,255,255,0.1);
            --txt:#ffffff; --gold:#ffd700; --pill-bg: rgba(255,255,255,0.1);
            --msg-bg: rgba(255,255,255,0.08); --sh-bg: rgba(255,255,255,0.03);
        }
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, var(--bg1) 0%, var(--bg2) 50%, var(--bg3) 100%);
            min-height: 100vh; color: var(--txt);
            display: flex; flex-wrap: wrap; justify-content: center; align-items: center;
        }
        .bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; overflow: hidden; }
        .bg span {
            position: absolute; width: 20px; height: 20px;
            background: rgba(255, 255, 255, 0.1); animation: mv 25s linear infinite;
            bottom: -150px; border-radius: 50%;
        }
        @keyframes mv {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-1000px) rotate(720deg); opacity: 0; }
        }
        .box { width: 100%; max-width: 600px; padding: 20px; z-index: 10; }
        .card {
            background: var(--card-bg); backdrop-filter: blur(16px);
            border-radius: 30px; border: 1px solid rgba(255,215,0,0.18);
            padding: 34px 22px; text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,215,0,0.04) inset;
            transition: background .6s ease, border-color .6s ease;
        }
        .top-title{ margin-bottom: 18px; }
        .ht-small{
            font-family: 'Poppins', sans-serif; font-size: 0.85rem; font-weight: 600;
            letter-spacing: 6px; color: var(--gold);
            text-shadow: 0 0 12px rgba(255,215,0,.6);
        }
        .ht-big{
            font-family: 'Lobster', cursive; font-size: 2.6rem; line-height: 1.15;
            background: linear-gradient(135deg, #ffe07a, #ffd700 40%, #d4a017 70%, #ffe07a);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
            text-shadow: 0 0 18px rgba(255,215,0,.35);
            margin-top: 2px;
        }
        
        .pic { margin: 8px auto 22px; width: 200px; height: 200px; position: relative; }
        .glow {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 260px; height: 260px;
            background: radial-gradient(circle, rgba(255,215,0,0.55) 0%, rgba(0,200,255,0.5) 35%, rgba(100,200,255,0.3) 55%, transparent 75%);
            filter: blur(40px); border-radius: 50%; z-index: 1; animation: pls 3s ease-in-out infinite alternate;
        }
        @keyframes pls {
            0% { opacity: 0.7; transform: translate(-50%, -50%) scale(0.9); }
            100% { opacity: 1; transform: translate(-50%, -50%) scale(1.15); }
        }
        .frame {
            width: 100%; height: 100%; border-radius: 50%; border: 4px solid rgba(255,215,0,0.55);
            overflow: hidden; position: relative; z-index: 2;
            box-shadow: 0 0 30px rgba(255,215,0,.6), 0 0 60px rgba(0,150,255,0.45), inset 0 0 30px rgba(0,150,255,0.3);
            background: linear-gradient(135deg, var(--bg1) 0%, var(--bg2) 50%, var(--bg3) 100%);
            display: flex; align-items: center; justify-content: center;
            transition: background .6s ease;
        }
        .ph {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 4.5rem; z-index: 1; animation: flt 3s ease-in-out infinite;
            filter: drop-shadow(0 0 25px rgba(0,200,255,0.7)); transition: opacity 0.5s;
        }
        @keyframes flt {
            0%, 100% { transform: translate(-50%, -50%) scale(1) rotate(-5deg); }
            50% { transform: translate(-50%, -50%) scale(1.15) rotate(5deg); }
        }
        .img {
            width: 100%; height: 100%; object-fit: cover;
            position: absolute; top: 0; left: 0; opacity: 0; transition: opacity 1.5s; z-index: 3;
        }
        .img.on { opacity: 1; }

        .nm {
            font-size: 2.3rem; font-weight: 800; margin: 10px 0 4px;
            background: linear-gradient(45deg, #ffd97a, #ffb6e6 40%, #c9a4ff 70%, #8ec9ff);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            animation: flt2 3s infinite;
        }
        @keyframes flt2 { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
        .divider{
            display: flex; align-items: center; justify-content: center; gap: 8px;
            margin: 6px 0 14px; opacity: .75;
        }
        .divider::before, .divider::after{
            content:""; height: 1px; width: 70px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
        }
        .divider span{ color: var(--gold); font-size: .9rem; }
        .dt {
            font-size: 1.1rem; color: var(--gold); background: var(--pill-bg);
            display: inline-block; padding: 5px 15px; border-radius: 50px; margin-bottom: 10px;
            transition: background .6s ease, color .6s ease;
        }
        .msg {
            background: var(--msg-bg); padding: 20px; border-radius: 20px;
            margin: 10px 0; font-size: 1rem; line-height: 1.5; white-space: pre-line;
            transition: background .6s ease;
        }
        .react-box{
            margin-top: 18px; padding: 16px 10px; border-radius: 20px;
            background: var(--card-bg); border: 1px solid var(--card-border);
        }
        .react-grid{
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px;
        }
        .react-item{
            display: flex; flex-direction: column; align-items: center; gap: 6px;
            cursor: pointer; padding: 6px 2px; border-radius: 14px; user-select: none;
            -webkit-tap-highlight-color: transparent; transition: transform .15s ease, background .2s ease;
        }
        .react-item:hover{ background: rgba(255,255,255,0.06); }
        .react-item:active{ transform: scale(.92); }
        .react-item .e{ font-size: 1.8rem; animation: bt 1.5s ease-in-out infinite; display: inline-block; }
        .react-item .lbl{ font-size: 0.72rem; opacity: 0.75; font-weight: 500; }
        @keyframes bt { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.2); } }
        .react-item.popped .e{ animation: popReact .5s ease; }
        @keyframes popReact{
            0%{ transform: scale(1); }
            40%{ transform: scale(1.6) rotate(-10deg); }
            100%{ transform: scale(1); }
        }
        
        .sh { margin-top: 15px; padding: 16px 12px; background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 20px; transition: background .6s ease; }
        .shb { display: flex; justify-content: center; align-items: center; gap: 12px; margin-top: 10px; flex-wrap: wrap; }
        .sic {
            width: 42px; height: 42px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            text-decoration: none; border: none; cursor: pointer; flex-shrink: 0;
            color: white; box-shadow: 0 4px 12px rgba(0,0,0,.3);
            transition: transform .15s ease, box-shadow .2s ease;
        }
        .sic svg{ display: block; }
        .sic:hover{ transform: translateY(-3px) scale(1.06); box-shadow: 0 6px 16px rgba(0,0,0,.4); }
        .sic:active{ transform: translateY(0) scale(.94); }
        .wa { background: #25D366; }
        .fb { background: #1877F2; }
        .ig { background: radial-gradient(circle at 30% 110%, #ffdb8b 0%, #ee6055 25%, #d62976 45%, #962fbf 70%, #4f5bd5 100%); }
        .cp-link {
            display: flex; align-items: center; justify-content: center; gap: 8px;
            width: 100%; margin-top: 16px; padding: 14px; border-radius: 50px;
            background: rgba(255,215,0,0.06); color: var(--txt); font-size: 1rem; font-weight: 700;
            border: 1px solid rgba(255,215,0,0.55); cursor: pointer;
            transition: transform .15s ease, box-shadow .2s ease, background .2s ease;
            box-shadow: 0 4px 18px rgba(255,215,0,.18);
        }
        .cp-link:hover{ transform: translateY(-2px); background: rgba(255,215,0,0.12); box-shadow: 0 6px 22px rgba(255,215,0,.3); }
        .cp-link:active{ transform: translateY(0) scale(.97); }
        .nb {
            margin-top: 14px; width: 100%; background: transparent;
            color: var(--txt); padding: 13px; font-size: 0.95rem; font-weight: 600; border: 1px solid var(--card-border);
            border-radius: 50px; cursor: pointer; transition: background .3s ease, color .3s ease, transform .15s ease, border-color .3s ease;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .nb:hover{ transform: translateY(-2px); border-color: rgba(255,215,0,0.5); }
        #c { position: fixed; top: 0; left: 0; pointer-events: none; z-index: 100; }

        /* ===== Responsive: phones, tablets, laptops, desktops ===== */
        @media (max-width: 360px){
            .card{ padding: 24px 16px; border-radius: 24px; }
            .cake{ font-size: 2.8rem; }
            .pic{ width: 160px; height: 160px; margin: 16px auto 20px; }
            .glow{ width: 210px; height: 210px; }
            .ph{ font-size: 3.6rem; }
            .nm{ font-size: 1.9rem; }
            .msg{ padding: 16px; font-size: 0.92rem; }
            .emo{ font-size: 1.4rem; letter-spacing: 5px; }
        }
        @media (min-width: 361px) and (max-width: 480px){
            .box{ padding: 16px; }
            .pic{ width: 180px; height: 180px; }
            .glow{ width: 235px; height: 235px; }
        }
        @media (min-width: 481px) and (max-width: 767px){
            .box{ max-width: 480px; }
            .card{ padding: 36px 28px; }
        }
        @media (min-width: 768px) and (max-width: 1024px){
            .box{ max-width: 560px; }
            .card{ padding: 44px 40px; border-radius: 34px; }
            .pic{ width: 230px; height: 230px; }
            .glow{ width: 290px; height: 290px; }
            .nm{ font-size: 2.8rem; }
            .msg{ font-size: 1.08rem; padding: 24px; }
        }
        @media (min-width: 1025px) and (max-width: 1440px){
            .box{ max-width: 600px; }
            .card{ padding: 42px 38px; }
        }
        @media (min-width: 1441px){
            .box{ max-width: 650px; }
            .card{ padding: 48px 44px; border-radius: 34px; }
            .pic{ width: 220px; height: 220px; }
            .nm{ font-size: 2.8rem; }
        }
        @media (max-height: 480px) and (orientation: landscape){
            body{ align-items: flex-start; }
            .box{ padding-top: 10px; }
            .pic{ width: 140px; height: 140px; margin: 10px auto 14px; }
            .glow{ width: 185px; height: 185px; }
        }
        @media (prefers-reduced-motion: reduce){
            *, *::before, *::after{
                animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important;
            }
        }
    </style>
</head>

    <script>
        const API = "https://urneinbrxacnwojhuvut.supabase.co/rest/v1/posts";
        const KEY = "sb_publishable_xLnFSAUTtuwpcdBjL2mu7w_k-zekj1K";
        
        let iv = null;
        
        window.onload = async () => {
            const p = new URLSearchParams(location.search);
            const id = p.get('id');
            
            if (!id) {
                document.getElementById('nm').textContent = "No ID";
                return;
            }

            try {
                const res = await fetch(`${API}?id=eq.${id}&select=*`, {
                    headers: {
                        "apikey": KEY,
                        "Authorization": `Bearer ${KEY}`
                    }
                });

                if (!res.ok) throw new Error("Load failed");

                const data = await res.json();
                if (data.length === 0) {
                    document.getElementById('nm').textContent = "Not found";
                    return;
                }

                const w = data[0];
                console.log("✅ Wish loaded");
                console.log("📊 Keys:", Object.keys(w).join(', '));
                console.log("📸 Has photo_url?", !!w.photo_url);
                console.log("📸 Has photo_url_2?", !!w.photo_url_2);
                
                if (w.photo_url) {
                    console.log("📸 photo_url type:", typeof w.photo_url);
                    console.log("📸 photo_url length:", w.photo_url.length);
                    console.log("📸 photo_url start:", w.photo_url.substring(0, 50));
                }
                
                // Display content
                document.getElementById('nm').textContent = w.name;
                
                if (w.birth_date) {
                    const d = new Date(w.birth_date);
                    document.getElementById('dt').textContent = `📅 ${d.getDate()}/${d.getMonth()+1}/${d.getFullYear()}`;
                } else {
                    document.getElementById('dt').style.display = 'none';
                }
                
                document.getElementById('msg').textContent = w.message;
                
                // Load photos from base64
                const codes = [];
                if (w.photo_url && w.photo_url.length > 100) {
                    codes.push(w.photo_url);
                    console.log("✅ Photo 1 added to codes");
                } else if (w.photo_url) {
                    console.log("⚠️ Photo 1 too short:", w.photo_url.length);
                }
                
                if (w.photo_url_2 && w.photo_url_2.length > 100) {
                    codes.push(w.photo_url_2);
                    console.log("✅ Photo 2 added to codes");
                } else if (w.photo_url_2) {
                    console.log("⚠️ Photo 2 too short:", w.photo_url_2.length);
                }
                
                console.log("📸 Total valid photos to load:", codes.length);
                
                if (codes.length > 0) {
                    load(codes);
                } else {
                    console.log("🎂 No valid photos found - placeholder remains");
                }
                
                // Share
                const url = location.href;
                document.getElementById('wa').href = `https://wa.me/?text=${encodeURIComponent("Surprise! 🎂 " + url)}`;
                document.getElementById('fb').href = `https://facebook.com/sharer/sharer.php?u=${encodeURIComponent(url)}`;
                document.getElementById('ig').href = `https://www.instagram.com/`;
                document.getElementById('ig').onclick = () => {
                    navigator.clipboard?.writeText(url).catch(()=>{});
                };
                
                anim();

            } catch (e) {
                console.error(e);
                document.getElementById('nm').textContent = "Error";
            }
        };

        function load(codes) {
            console.log("🖼️ Loading photos, count:", codes.length);
            
            const ph = document.getElementById('ph');
            const i1 = document.getElementById('i1');
            const i2 = document.getElementById('i2');
            
            if (!codes || codes.length === 0) {
                console.log("🎂 No photos - showing placeholder");
                return;
            }
            
            // Check if base64 is valid
            if (codes[0].length < 100) {
                console.error("❌ Photo 1 base64 too short:", codes[0].length);
                return;
            }
            
            console.log("📸 Photo 1 base64 length:", codes[0].length);
            console.log("📸 Photo 1 first 50 chars:", codes[0].substring(0, 50));
            
            // Set photo 1 from base64
            const src1 = `data:image/jpeg;base64,${codes[0]}`;
            console.log("🔗 Setting photo 1 src, total length:", src1.length);
            
            i1.src = src1;
            
            // Fallback timeout
            const timeout1 = setTimeout(() => {
                console.log("⏰ Photo 1 timeout - forcing display");
                ph.style.opacity = '0';
                setTimeout(() => ph.style.display = 'none', 500);
                i1.classList.add('on');
            }, 1000);
            
            i1.onload = () => {
                clearTimeout(timeout1);
                console.log("✅ Photo 1 loaded successfully!");
                ph.style.opacity = '0';
                setTimeout(() => ph.style.display = 'none', 500);
                i1.classList.add('on');
            };
            
            i1.onerror = (e) => {
                clearTimeout(timeout1);
                console.error("❌ Photo 1 load error:", e);
                console.log("🎂 Keeping placeholder");
            };
            
            // Set photo 2 if exists
            if (codes.length > 1 && codes[1].length > 100) {
                console.log("📸 Photo 2 base64 length:", codes[1].length);
                i2.src = `data:image/jpeg;base64,${codes[1]}`;
                
                i2.onload = () => {
                    console.log("✅ Photo 2 loaded successfully!");
                    setTimeout(() => swap(i1, i2), 2000);
                };
                
                i2.onerror = (e) => {
                    console.error("❌ Photo 2 load error:", e);
                };
            }
        }

        function swap(i1, i2) {
            let s = true;
            if (iv) clearInterval(iv);
            iv = setInterval(() => {
                i1.classList.toggle('on', s);
                i2.classList.toggle('on', !s);
                s = !s;
            }, 4000);
        }

        function copy() {
            navigator.clipboard.writeText(location.href)
                .then(() => alert("Copied!"))
                .catch(() => alert("Copy manually"));
        }

        function anim() {
            const cv = document.getElementById('c');
            const cx = cv.getContext('2d');
            cv.width = innerWidth;
            cv.height = innerHeight;
            
            const bs = [];
            for (let i = 0; i < 80; i++) {
                bs.push({
                    x: Math.random() * cv.width,
                    y: Math.random() * cv.height - cv.height,
                    w: Math.random() * 10 + 5,
                    h: Math.random() * 10 + 5,
                    c: `hsl(${Math.random() * 360}, 80%, 60%)`,
                    s: Math.random() * 3 + 2,
                    r: Math.random() * 360
                });
            }

            function dr() {
                cx.clearRect(0, 0, cv.width, cv.height);
                bs.forEach(b => {
                    cx.save();
                    cx.fillStyle = b.c;
                    cx.translate(b.x, b.y);
                    cx.rotate(b.r * Math.PI / 180);
                    cx.fillRect(-b.w/2, -b.h/2, b.w, b.h);
                    cx.restore();
                    b.y += b.s;
                    b.r += 2;
                    if (b.y > cv.height) b.y = -20;
                });
                requestAnimationFrame(dr);
            }
            dr();
        }
    </script>
</body>
</html>
